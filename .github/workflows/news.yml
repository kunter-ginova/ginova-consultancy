# News desk robot: RETIRED as the scheduler on 2026-11-12 (Kunter Bey).
# The Cloudflare Worker "ginova-consultancy" now collects the headlines itself every day (published 08:00 Istanbul)
# and translates them; the live desk does not read this repo's data/news.json. Kept only as a manual backup.
name: News desk (manual backup)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-desk
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch headlines (keeps the previous file if the run looks broken)
        run: python3 tools/news/fetch_news.py data/news.json
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || (git commit -m "News desk: refresh" && git push)
