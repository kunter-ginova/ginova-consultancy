# News desk robot: collects English headlines twice a day into data/news.json.
# Translations into the other seven languages are made by the Cloudflare Worker "ginova-consultancy" (Workers AI), not here.
name: News desk
on:
  schedule:
    - cron: '30 4 * * *'      # 07:30 Istanbul
    - cron: '30 16 * * *'     # 19:30 Istanbul
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-desk
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch headlines (keeps the previous file if the run looks broken)
        run: python3 tools/news/fetch_news.py data/news.json
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || (git commit -m "News desk: refresh" && git push)
